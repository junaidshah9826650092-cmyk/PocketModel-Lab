<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="meshBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="meshPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="1024" height="1024" rx="220" fill="url(#iconBg)"/>
  
  <!-- Mesh/Network geometric shape (PocketAI icon) -->
  <!-- Left blue shape -->
  <path d="M280 520 L360 420 L460 440 L380 560 Z" fill="#38bdf8"/>
  <path d="M360 420 L460 440 L560 540 L420 560 Z" fill="#22d3ee"/>
  
  <!-- Center tall spike -->
  <path d="M500 260 L540 480 L620 480 L580 300 Z" fill="#38bdf8"/>
  
  <!-- Right purple shape -->
  <path d="M540 320 L640 320 L740 480 L600 480 Z" fill="#c084fc"/>
  <path d="M640 320 L740 480 L740 640 L580 640 Z" fill="#a855f7"/>
  
  <!-- Bottom blue shape -->
  <path d="M580 480 L680 640 L560 760 L460 640 Z" fill="#22d3ee"/>
  <path d="M460 640 L560 760 L440 680 L360 580 L460 580 Z" fill="#38bdf8"/>
  
  <!-- Bottom small purple triangle -->
  <path d="M560 760 L640 760 L600 840 Z" fill="#a855f7"/>
  
  <!-- Inner detail lines -->
  <path d="M500 260 L580 480" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M360 420 L500 480" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M640 320 L580 480" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M580 480 L600 640" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Central dot -->
  <circle cx="512" cy="480" r="14" fill="#f1f5f9"/>
</svg>
