<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#grad)"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#22d3ee" stroke-width="18" opacity="0.6"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4"/>
  <!-- Phone body -->
  <rect x="312" y="320" width="400" height="680" rx="90" fill="#334155" stroke="#475569" stroke-width="12"/>
  <!-- Screen -->
  <rect x="356" y="380" width="312" height="560" rx="56" fill="#064e3b" opacity="0.95"/>
  <!-- Screen content: chat bubbles -->
  <rect x="396" y="460" width="180" height="48" rx="24" fill="#22d3ee" opacity="0.9"/>
  <rect x="396" y="520" width="220" height="48" rx="24" fill="#34d399" opacity="0.9"/>
  <rect x="440" y="580" width="160" height="44" rx="22" fill="#a78bfa" opacity="0.9"/>
  <rect x="396" y="640" width="260" height="52" rx="26" fill="#f472b6" opacity="0.9"/>
  <!-- AI brain -->
  <circle cx="512" cy="280" r="52" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M468 280 Q512 240 556 280 Q512 320 468 280" stroke="#22d3ee" stroke-width="10" fill="none"/>
  <path d="M490 302 Q512 280 534 302" stroke="#ffffff" stroke-width="6" fill="none"/>
  <!-- Circuit trace -->
  <path d="M340 700 L684 700 L684 760 L580 760 L580 840 L740 840" stroke="#22d3ee" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Text -->
  <text x="512" y="960" font-family="sans-serif" font-size="56" font-weight="800" fill="#22d3ee" text-anchor="middle">PocketAI</text>
  <text x="512" y="1000" font-family="sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Mobile AI • GGUF • On-Device</text>
</svg>
