<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- बैकग्राउंड और आइकन के लिए ग्रेडिएंट्स -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1528" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ef2ff" />
      <stop offset="50%" stop-color="#22b8ff" />
      <stop offset="100%" stop-color="#3b66f5" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c471ed" />
      <stop offset="50%" stop-color="#8a4fff" />
      <stop offset="100%" stop-color="#5b24d6" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ef9ff" />
      <stop offset="50%" stop-color="#1cb5e0" />
      <stop offset="100%" stop-color="#7b42f6" />
    </linearGradient>
  </defs>

  <!-- ऐप आइकन का राउंडेड बैकग्राउंड -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgGrad)" stroke="#1e2947" stroke-width="2"/>

  <!-- बायां हिस्सा (ब्रेन पॉलीगॉन) -->
  <polygon points="168,162 212,146 184,210 132,248" fill="url(#cyanGrad)" />
  <polygon points="168,162 132,248 164,284 184,210" fill="#189ad3" />
  <polygon points="132,248 164,284 242,284 242,312 162,312" fill="url(#purpleGrad)" />
  <polygon points="184,210 212,146 218,184 188,242" fill="#48cae4" />

  <!-- दायां हिस्सा (ब्रेन पॉलीगॉन) -->
  <polygon points="266,142 336,162 310,202 266,192" fill="url(#purpleGrad)" />
  <polygon points="336,162 376,222 310,202" fill="#d084f5" />
  <polygon points="310,202 376,222 332,246" fill="url(#cyanGrad)" />
  <polygon points="332,246 376,222 362,288 312,272" fill="#29b6f6" />
  <polygon points="312,272 362,288 322,324 282,292" fill="url(#purpleGrad)" />
  <polygon points="282,292 312,334 294,378 264,328" fill="#7c4dff" />

  <!-- बीच का मुख्य लाइटनिंग बोल्ट (Lightning Bolt) -->
  <polygon points="258,108 188,266 254,266 238,392 332,242 258,242" fill="url(#boltGrad)" />
  <!-- लाइटनिंग बोल्ट पर 3D हाइलाइट शेडिंग -->
  <polygon points="258,108 254,266 188,266" fill="#80f5ff" opacity="0.55" />
  <polygon points="258,242 332,242 238,392 254,266" fill="#4a6cf7" opacity="0.45" />
</svg>
