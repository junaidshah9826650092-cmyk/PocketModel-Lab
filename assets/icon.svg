<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#iconBg)"/>
  
  <!-- Outer accent ring -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="#334155" stroke-width="18"/>
  
  <!-- Pocket shape (iconic, centered) -->
  <path d="M512 760 L580 820 L684 820 L684 900 L340 900 L340 820 L444 820 Z" fill="#38bdf8" filter="url(#softShadow)"/>
  
  <!-- Phone device -->
  <rect x="312" y="312" width="400" height="700" rx="88" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="356" y="364" width="312" height="596" rx="52" fill="#020617"/>
  
  <!-- Screen content -->
  <rect x="396" y="408" width="48" height="6" rx="3" fill="#22d3ee"/>
  <rect x="458" y="408" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="396" y="448" width="150" height="44" rx="22" fill="#334155"/>
  <rect x="396" y="504" width="190" height="44" rx="22" fill="#334155"/>
  <rect x="440" y="560" width="130" height="40" rx="20" fill="#334155"/>
  <rect x="396" y="612" width="210" height="48" rx="24" fill="#334155"/>
  
  <!-- AI Core circle -->
  <circle cx="512" cy="270" r="44" fill="#38bdf8" filter="url(#softShadow)"/>
  <path d="M474 270 Q512 236 550 270 Q512 304 474 270" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  
  <!-- "P" monogram subtle -->
  <text x="512" y="880" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#22d3ee" text-anchor="middle" letter-spacing="-20">P</text>
  
  <!-- Subtle glow behind core -->
  <circle cx="512" cy="270" r="60" fill="#38bdf8" opacity="0.3" filter="url(#softShadow)"/>
</svg>
