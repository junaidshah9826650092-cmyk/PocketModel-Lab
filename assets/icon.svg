<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#appBg)"/>
  
  <!-- Outer glow ring -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="#334155" stroke-width="18"/>
  
  <!-- Pulsing energy ring -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#22d3ee" stroke-width="6" opacity="0.5">
    <animate attributeName="r" values="380;430;380" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pocket shape (iconic) -->
  <path d="M512 760 L580 820 L684 820 L684 900 L340 900 L340 820 L444 820 Z" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Phone device -->
  <rect x="312" y="312" width="400" height="700" rx="88" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="356" y="364" width="312" height="596" rx="52" fill="#020617"/>
  
  <!-- Screen content -->
  <rect x="396" y="408" width="48" height="6" rx="3" fill="#22d3ee"/>
  <rect x="458" y="408" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="396" y="448" width="150" height="44" rx="22" fill="#334155"/>
  <rect x="396" y="504" width="190" height="44" rx="22" fill="#334155"/>
  <rect x="440" y="560" width="130" height="40" rx="20" fill="#334155"/>
  <rect x="396" y="612" width="210" height="48" rx="24" fill="#334155"/>

  <!-- AI core -->
  <circle cx="512" cy="270" r="44" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="44;52;44" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M474 270 Q512 236 550 270 Q512 304 474 270" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="512" y="964" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" text-anchor="middle">PocketAI</text>
  <text x="512" y="996" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">On-Device AI &bull; GGUF</text>
</svg>
