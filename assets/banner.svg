<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="50%" stop-color="#13182b"/>
      <stop offset="100%" stop-color="#0d1324"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>
  <rect width="1920" height="600" fill="url(#heroBg)"/>

  <!-- Floating orbs -->
  <circle cx="200" cy="450" r="140" fill="url(#orb1)" opacity="0.18">
    <animate attributeName="cy" values="450;390;450" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1720" cy="180" r="160" fill="url(#orb2)" opacity="0.16">
    <animate attributeName="cy" values="180;240;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="100" r="90" fill="#c084fc" opacity="0.12">
    <animate attributeName="r" values="90;120;90" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Brand mark (left) -->
  <circle cx="160" cy="320" r="72" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
  <path d="M130 320 Q160 280 190 320 Q160 360 130 320" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 200;200 200" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="160" cy="320" r="18" fill="#38bdf8"/>
  <animateTransform attributeName="transform" type="rotate" values="0 160 320;360 160 320" dur="10s" repeatCount="indefinite"/>

  <!-- Brand text -->
  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#f1f5f9" letter-spacing="-3">PocketAI</text>
  <text x="300" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="1">Compressed LLMs for mobile devices</text>
  <rect x="300" y="332" width="48" height="5" fill="#38bdf8">
    <animate attributeName="width" values="48;140;48" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Divider -->
  <line x1="540" y1="80" x2="540" y2="520" stroke="#223040" stroke-width="2"/>

  <!-- Phone mockup -->
  <g transform="translate(1080, 90)">
    <rect x="0" y="0" width="320" height="520" rx="88" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="30" y="60" width="260" height="400" rx="48" fill="#020617"/>
    <!-- Screen content -->
    <rect x="70" y="120" width="36" height="6" rx="3" fill="#22d3ee"/>
    <rect x="124" y="120" width="30" height="6" rx="3" fill="#334155"/>
    <rect x="70" y="152" width="120" height="44" rx="22" fill="#334155"/>
    <rect x="70" y="210" width="160" height="44" rx="22" fill="#334155"/>
    <rect x="110" y="268" width="110" height="40" rx="20" fill="#334155"/>
    <rect x="70" y="320" width="180" height="48" rx="24" fill="#334155"/>
  </g>

  <!-- Stats -->
  <text x="1480" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">0.3 GB</text>
  <text x="1480" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Budget phone</text>
  <text x="1480" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9">1.1 GB</text>
  <text x="1480" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Flagship quality</text>
  <text x="300" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#cbd5e1">PocketPal AI &bull; ChatterUI &bull; Termux &bull; Ollama &bull; LM Studio</text>
</svg>
