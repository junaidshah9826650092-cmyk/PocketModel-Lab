<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- Decorative nodes -->
  <circle cx="120" cy="480" r="40" fill="#22d3ee" opacity="0.15"/>
  <circle cx="1800" cy="120" r="60" fill="#a78bfa" opacity="0.12"/>
  <circle cx="400" cy="80" r="30" fill="#38bdf8" opacity="0.1"/>
  <!-- Left badge -->
  <rect x="120" y="220" width="220" height="140" rx="30" fill="rgba(255,255,255,0.04)"/>
  <circle cx="180" cy="280" r="40" fill="#22d3ee" opacity="0.2"/>
  <circle cx="180" cy="280" r="20" fill="#22d3ee"/>
  <text x="120" y="350" font-family="sans-serif" font-size="22" font-weight="700" fill="#22d3ee">POCKETAI</text>
  <text x="120" y="390" font-family="sans-serif" font-size="16" fill="#94a3b8">On-Device • GGUF • Mobile</text>
  <!-- Center phone -->
  <rect x="800" y="180" width="320" height="560" rx="80" fill="#334155" stroke="#475569" stroke-width="10"/>
  <rect x="850" y="240" width="220" height="440" rx="48" fill="#064e3b" opacity="0.95"/>
  <rect x="890" y="320" width="140" height="40" rx="20" fill="#22d3ee"/>
  <rect x="890" y="380" width="170" height="36" rx="18" fill="#34d399"/>
  <rect x="890" y="435" width="120" height="32" rx="16" fill="#a78bfa"/>
  <!-- Right text -->
  <text x="1200" y="260" font-family="sans-serif" font-size="52" font-weight="800" fill="#ffffff">PocketAI</text>
  <text x="1200" y="320" font-family="sans-serif" font-size="22" fill="#22d3ee">Compressed LLMs for every phone</text>
  <text x="1200" y="360" font-family="sans-serif" font-size="18" fill="#cbd5e1">0.3 GB • 0.4 GB • 0.7 GB • 1.1 GB builds</text>
  <rect x="1200" y="390" width="180" height="4" fill="url(#accent)"/>
  <text x="1200" y="430" font-family="sans-serif" font-size="16" fill="#94a3b8">PocketPal • ChatterUI • Termux • Ollama • LM Studio</text>
  <!-- Footer -->
  <line x1="120" y1="540" x2="1800" y2="540" stroke="#334155" stroke-width="2"/>
  <text x="120" y="570" font-family="sans-serif" font-size="14" fill="#64748b">Built by Nadeem &bull; Apache-2.0 &bull; GitHub Release • Hugging Face Mirror</text>
</svg>
