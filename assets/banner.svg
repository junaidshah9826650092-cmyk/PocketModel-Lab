<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1920" height="600" fill="url(#heroGrad)"/>

  <!-- Floating orbs -->
  <circle cx="180" cy="480" r="110" fill="url(#orbGlow)">
    <animate attributeName="cy" values="480;440;480" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1740" cy="140" r="140" fill="#a855f7" opacity="0.15">
    <animate attributeName="cy" values="140;180;140" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="120" r="60" fill="#22d3ee" opacity="0.2">
    <animate attributeName="r" values="60;80;60" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Brand mark -->
  <circle cx="140" cy="300" r="76" fill="#334155"/>
  <path d="M104 300 Q140 260 176 300 Q140 340 104 300" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="rotate" values="0 140 300;10 140 300;-10 140 300;0 140 300" dur="5s" repeatCount="indefinite"/>
  <rect x="104" y="440" width="72" height="8" rx="4" fill="#38bdf8"/>

  <!-- Brand text -->
  <text x="280" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#f1f5f9" letter-spacing="-2">PocketAI</text>
  <text x="280" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Compressed LLMs for mobile devices</text>
  <rect x="280" y="340" width="44" height="5" fill="#38bdf8">
    <animate attributeName="width" values="44;120;44" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Divider -->
  <line x1="560" y1="100" x2="560" y2="500" stroke="#334155" stroke-width="2"/>

  <!-- Phone mockup -->
  <rect x="1080" y="90" width="340" height="500" rx="80" fill="#1e293b"/>
  <rect x="1130" y="150" width="240" height="380" rx="40" fill="#020617"/>
  <!-- Screen content -->
  <rect x="1170" y="200" width="40" height="6" rx="3" fill="#38bdf8"/>
  <rect x="1224" y="200" width="32" height="6" rx="3" fill="#334155"/>
  <rect x="1170" y="232" width="140" height="44" rx="22" fill="#334155"/>
  <rect x="1170" y="288" width="180" height="44" rx="22" fill="#334155"/>
  <rect x="1220" y="344" width="120" height="40" rx="20" fill="#334155"/>
  <rect x="1170" y="398" width="200" height="48" rx="24" fill="#334155"/>

  <!-- Stats -->
  <text x="1480" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f1f5f9">0.3 GB</text>
  <text x="1480" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Budget phone</text>
  <text x="1480" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f1f5f9">1.1 GB</text>
  <text x="1480" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Flagship quality</text>
  <text x="280" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#cbd5e1">PocketPal AI &bull; ChatterUI &bull; Termux &bull; Ollama &bull; LM Studio</text>
</svg>
